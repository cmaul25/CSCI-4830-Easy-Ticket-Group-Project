{% extends 'tickets/base.html' %}

{% block content %}
<div class="grid">
    <div class="card">
        <h1>Account Page</h1>
        <p class="muted">Update your profile information here.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Save Account Changes</button>
        </form>
    </div>

    <div class="card">
        <h2>Your Ticket Stats</h2>
        <p><strong>Tickets you created:</strong> {{ created_count }}</p>
        <p><strong>Tickets assigned to you:</strong> {{ assigned_count }}</p>
    </div>
</div>
{% endblock %}
