<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Easy Ticket</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7fb; }
        .box { max-width: 420px; margin: 80px auto; background: white; padding: 24px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        input { width: 100%; padding: 10px; margin: 8px 0 14px; box-sizing: border-box; }
        button { background: #173b63; color: white; border: none; padding: 10px 16px; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Easy Ticket Login</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>
        <p><a href="{% url 'signup' %}">Create an account</a></p>
    </div>
</body>
</html>
